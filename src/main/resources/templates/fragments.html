<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">UFSM - Gestão de Bolsas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-ufsm { background-color: #0054a6; }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-ufsm mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Laboratórios - Academicos</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/laboratorios/ui/listar}">Laboratórios</a>
            <a class="nav-link" th:href="@{/bolsistas/ui/listar}">Bolsistas</a>
        </div>
    </div>
</nav>

<!-- Fragmento para mensagens flash (sucesso/erro) -->
<div th:fragment="mensagens">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
</div>

</body>
</html>
